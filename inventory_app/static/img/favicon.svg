<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
  <defs>
    <!-- Top Diamond Plane -->
    <linearGradient id="hexTop" x1="8" y1="4" x2="32" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fdba74"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>
    <!-- Left Facet Plane -->
    <linearGradient id="hexLeft" x1="8" y1="18" x2="20" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <!-- Right Facet Plane -->
    <linearGradient id="hexRight" x1="20" y1="18" x2="32" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <!-- Drop Shadow Glow -->
    <filter id="hexGlow" x="0" y="0" width="40" height="40" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#hexGlow)">
    <!-- Top Iso Diamond -->
    <path d="M20 4.5L33 12L20 19.5L7 12L20 4.5Z" fill="url(#hexTop)"/>
    <!-- Left Iso Plane -->
    <path d="M7 12.5L20 20V35L7 27.5V12.5Z" fill="url(#hexLeft)"/>
    <!-- Right Iso Plane -->
    <path d="M33 12.5L20 20V35L33 27.5V12.5Z" fill="url(#hexRight)"/>
    
    <!-- Precision Inner Monogram Bridges -->
    <path d="M20 8L27.5 12.3L20 16.6L12.5 12.3L20 8Z" fill="white" fill-opacity="0.25"/>
    <path d="M20 20L20 31L29.5 25.5V14.5L20 20Z" fill="white" fill-opacity="0.12"/>
    <path d="M20 20L20 31L10.5 25.5V14.5L20 20Z" fill="white" fill-opacity="0.18"/>
  </g>
</svg>
