{% if session.get('registered_user') %}
{% set reg_user = session.pop('registered_user', None) %}
<div id="user-credentials-modal" class="modal-backdrop" style="position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 9999; animation: fadeIn 0.25s ease-out; padding: 1rem;">
  <div class="card" style="width: 100%; max-width: 460px; padding: 1.75rem; border-radius: 14px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); background: #ffffff; border: 1px solid #e2e8f0; text-align: left;">
    <div style="text-align: center; margin-bottom: 1.25rem;">
      <div style="width: 52px; height: 52px; background: #dcfce7; color: #15803d; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 0.75rem auto; font-size: 1.4rem;">
        <i class="fa-solid fa-user-check"></i>
      </div>
      <h2 style="font-size: 1.25rem; font-weight: 700; color: #0f172a; margin-bottom: 0.25rem;">User Account Created</h2>
      <p style="font-size: 0.85rem; color: #64748b;">Account registered successfully. Below are the user credentials:</p>
    </div>

    <!-- Full Name Field -->
    {% if reg_user.name %}
    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label" style="font-weight: 600; font-size: 0.75rem; color: #475569; letter-spacing: 0.05em; text-transform: uppercase;">Full Name</label>
      <input type="text" class="form-control" value="{{ reg_user.name }}" readonly style="background: #f8fafc; font-weight: 600; color: #0f172a;">
    </div>
    {% endif %}

    <!-- Auto-Generated Username Field -->
    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label" style="font-weight: 600; font-size: 0.75rem; color: #475569; letter-spacing: 0.05em; text-transform: uppercase;">Auto-Generated Username</label>
      <div style="display: flex; gap: 0.5rem;">
        <input type="text" id="modal-username" class="form-control" value="{{ reg_user.username }}" readonly style="background: #f8fafc; font-weight: 600; color: #0f172a;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="copyModalField('modal-username', this)" title="Copy Username" style="padding: 0 0.75rem;">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
    </div>

    <!-- Email Field -->
    <div class="form-group" style="margin-bottom: 1rem;">
      <label class="form-label" style="font-weight: 600; font-size: 0.75rem; color: #475569; letter-spacing: 0.05em; text-transform: uppercase;">Email Address</label>
      <div style="display: flex; gap: 0.5rem;">
        <input type="text" id="modal-email" class="form-control" value="{{ reg_user.email }}" readonly style="background: #f8fafc; font-weight: 600; color: #0f172a;">
        <button type="button" class="btn btn-secondary btn-sm" onclick="copyModalField('modal-email', this)" title="Copy Email" style="padding: 0 0.75rem;">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
    </div>

    <!-- Password Field with Hide/Unhide Toggle -->
    <div class="form-group" style="margin-bottom: 1.5rem;">
      <label class="form-label" style="font-weight: 600; font-size: 0.75rem; color: #475569; letter-spacing: 0.05em; text-transform: uppercase;">Password</label>
      <div style="display: flex; gap: 0.5rem; position: relative;">
        <div style="position: relative; flex: 1;">
          <input type="password" id="modal-password" class="form-control" value="{{ reg_user.password }}" readonly style="background: #f8fafc; font-weight: 600; color: #0f172a; padding-right: 2.5rem;">
          <button type="button" onclick="togglePasswordVisibility('modal-password', this)" class="password-toggle-btn" style="right: 0.5rem;" title="Show/Hide Password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <button type="button" class="btn btn-secondary btn-sm" onclick="copyModalField('modal-password', this)" title="Copy Password" style="padding: 0 0.75rem;">
          <i class="fa-solid fa-copy"></i>
        </button>
      </div>
    </div>

    <div style="display: flex; gap: 0.5rem;">
      <button type="button" class="btn btn-primary" onclick="closeUserModal()" style="width: 100%; padding: 0.65rem; font-weight: 600;">
        <i class="fa-solid fa-check"></i> Done
      </button>
    </div>
  </div>
</div>

<script>
function toggleModalPassword() {
  const pwInput = document.getElementById('modal-password');
  const pwIcon = document.getElementById('toggle-pw-icon');
  if (pwInput.type === 'password') {
    pwInput.type = 'text';
    pwIcon.classList.remove('fa-eye');
    pwIcon.classList.add('fa-eye-slash');
  } else {
    pwInput.type = 'password';
    pwIcon.classList.remove('fa-eye-slash');
    pwIcon.classList.add('fa-eye');
  }
}

function copyModalField(elementId, btn) {
  const el = document.getElementById(elementId);
  navigator.clipboard.writeText(el.value).then(() => {
    const origHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-check" style="color: #059669;"></i>';
    setTimeout(() => { btn.innerHTML = origHtml; }, 1500);
  });
}

function closeUserModal() {
  const modal = document.getElementById('user-credentials-modal');
  if (modal) {
    modal.style.opacity = '0';
    modal.style.transition = 'opacity 0.2s ease-out';
    setTimeout(() => modal.remove(), 200);
  }
}
</script>
{% endif %}
