{% extends "base.html" %}

{% block title %}Access Denied - 403{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <i class="fa-solid fa-shield-halved" style="font-size: 4rem; color: #f87171; margin-bottom: 1rem;"></i>
  <h1 style="font-size: 2rem; font-weight: 700; color: #fff;">403 - Forbidden Access</h1>
  <p style="color: var(--text-muted); margin-top: 0.5rem; margin-bottom: 2rem;">You do not possess the required user role permissions to perform this operation.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Return to Dashboard</a>
</div>
{% endblock %}
