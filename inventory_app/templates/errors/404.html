{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <i class="ri-compass-line" style="font-size: 4rem; color: var(--accent); margin-bottom: 1rem;"></i>
  <h1 style="font-size: 2rem; font-weight: 700; color: #fff;">Page Not Found</h1>
  <p style="color: var(--text-muted); margin-top: 0.5rem; margin-bottom: 2rem;">The page you're looking for doesn't exist or has been moved.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="ri-home-4-line"></i> Return to Dashboard</a>
</div>
{% endblock %}
