{% extends "base.html" %}

{% block title %}Server Error - 500{% endblock %}

{% block content %}
<div style="text-align: center; padding: 4rem 1rem;">
  <i class="fa-solid fa-triangle-exclamation" style="font-size: 4rem; color: #fbbf24; margin-bottom: 1rem;"></i>
  <h1 style="font-size: 2rem; font-weight: 700; color: #fff;">500 - Internal Server Error</h1>
  <p style="color: var(--text-muted); margin-top: 0.5rem; margin-bottom: 2rem;">An unexpected system error occurred. Our team has logged the event.</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="fa-solid fa-house"></i> Return to Dashboard</a>
</div>
{% endblock %}
